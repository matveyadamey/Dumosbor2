[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**/*.py", "requirements.txt", "Dockerfile", "railway.toml"]

[deploy]
# при старте накатываем миграции, затем поднимаем единый процесс (bot + api)
startCommand = "alembic upgrade head && python runner.py"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10