[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**/*.py", "requirements.txt", "Dockerfile", "railway.toml"]

[deploy]
# Миграции до старта приложения — иначе healthcheck ждёт, пока alembic держит порт закрытым
preDeployCommand = ["alembic upgrade head"]
startCommand = "python -u runner.py"
healthcheckPath = "/live"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
