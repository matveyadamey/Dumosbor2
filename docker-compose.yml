version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    command: sh -c "alembic upgrade head && APP_MODE=api python -u runner.py"
    env_file: .env
    environment:
      APP_MODE: api
      MEDIA_DIR: /app/media_data
    ports:
      - "8000:8000"
    volumes:
      - ./media_data:/app/media_data
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    command: sh -c "APP_MODE=bot python -u runner.py"
    env_file: .env
    environment:
      APP_MODE: bot
      MEDIA_DIR: /app/media_data
    volumes:
      - ./media_data:/app/media_data
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pg_data:
