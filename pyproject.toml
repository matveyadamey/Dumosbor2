[project]
name = "dumosbor2"
version = "1.0.0"
description = "Telegram → Obsidian sync (bot + API)"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["api", "bot", "core", "tests"]
extend-exclude = ["alembic/versions", "obsidian-plugin"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501",  # line length — formatter handles soft wraps
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"alembic/env.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["api", "bot", "core"]
omit = ["alembic/*", "runner.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
